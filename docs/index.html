<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Site Performance Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
  :root{
    --ink:#111826; --ink-2:#586372; --ink-3:#98a1ad;
    --line:#e9ecf0; --line-2:#f2f4f7; --bg:#ffffff; --panel:#fbfcfd;
    --good:#0cce6b; --ni:#ffa400; --poor:#ff4e42; --none:#c2c8d0;
    --good-bg:#e7faf0; --ni-bg:#fff4e0; --poor-bg:#ffece9; --none-bg:#f3f5f7;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased;}
  .num{font-family:"Space Grotesk",Inter,sans-serif;font-feature-settings:"tnum" 1;}
  .wrap{max-width:1120px;margin:0 auto;padding:0 24px;}
  header.top{border-bottom:1px solid var(--line);padding:20px 0;position:sticky;top:0;background:rgba(255,255,255,.9);backdrop-filter:blur(8px);z-index:5;}
  .top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;}
  .brand{font-weight:600;font-size:15.5px;display:flex;align-items:center;gap:10px;letter-spacing:-.01em;}
  .logoDot{width:22px;height:22px;border-radius:6px;background:var(--ink);display:inline-flex;align-items:center;justify-content:center;}
  .logoDot::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--good);}
  .sub{color:var(--ink-3);font-size:12.5px;}
  .lead{padding:40px 0 6px;}
  .lead h1{font-size:25px;font-weight:600;letter-spacing:-.02em;margin:0 0 6px;}
  .lead p{color:var(--ink-2);margin:0;font-size:14.5px;max-width:62ch;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:20px;padding:26px 0 64px;}
  .card{border:1px solid var(--line);border-radius:18px;padding:22px;background:var(--bg);cursor:pointer;transition:border-color .15s,box-shadow .15s,transform .15s;}
  .card:hover{border-color:#d8dde3;box-shadow:0 8px 30px rgba(17,24,38,.07);transform:translateY(-2px);}
  .chead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:6px;}
  .cname{font-weight:600;font-size:16px;letter-spacing:-.01em;}
  .chost{color:var(--ink-3);font-size:12.5px;}
  .gaugeRow{display:flex;justify-content:space-between;gap:6px;margin-top:14px;}
  .gauge{display:flex;flex-direction:column;align-items:center;gap:7px;flex:1;min-width:0;}
  .glabel{font-size:10px;color:var(--ink-2);font-weight:600;letter-spacing:-.01em;text-align:center;line-height:1.2;white-space:nowrap;}
  .back{display:inline-flex;align-items:center;gap:7px;color:var(--ink-2);font-size:13.5px;margin:28px 0 0;cursor:pointer;}
  .back:hover{color:var(--ink);}
  .dhead{display:flex;align-items:baseline;gap:14px;margin:14px 0 2px;flex-wrap:wrap;}
  .dhead h1{font-size:24px;font-weight:600;letter-spacing:-.02em;margin:0;}
  .dhead .host{color:var(--ink-3);font-size:14px;}
  .hero{border:1px solid var(--line);border-radius:18px;padding:26px;margin:22px 0;display:flex;justify-content:center;gap:48px;flex-wrap:wrap;}
  .panel{border:1px solid var(--line);border-radius:18px;padding:22px;margin:22px 0;}
  .panel h2{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);margin:0;font-weight:600;}
  .panel .h-sub{color:var(--ink-3);font-size:12.5px;margin:2px 0 0;}
  table{width:100%;border-collapse:collapse;font-size:13px;margin-top:14px;}
  th,td{padding:10px;text-align:right;border-bottom:1px solid var(--line-2);white-space:nowrap;}
  th{color:var(--ink-3);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.04em;cursor:pointer;user-select:none;}
  th.l,td.l{text-align:left;} td.page{max-width:360px;overflow:hidden;text-overflow:ellipsis;color:var(--ink);}
  .pill{display:inline-block;min-width:40px;padding:3px 9px;border-radius:7px;font-weight:600;}
  .pill.good{color:#08894a;background:var(--good-bg);} .pill.ni{color:#b9750a;background:var(--ni-bg);}
  .pill.poor{color:#cc2c22;background:var(--poor-bg);} .pill.none{color:var(--none);background:var(--none-bg);}
  footer{color:var(--ink-3);font-size:12px;padding:28px 0 50px;border-top:1px solid var(--line);}
  .empty{padding:80px 0;text-align:center;color:var(--ink-3);}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useMemo } = React;
function band(v){ if(v===null||v===undefined) return 'none'; return v>=90?'good':(v>=50?'ni':'poor'); }
const host = u=>{try{return new URL(u).host;}catch(e){return u;}};
const path = u=>{try{const p=new URL(u).pathname;return p==='/'?'Homepage':p;}catch(e){return u;}};

function Gauge({score,label,size=76}){
  const stroke=7, r=(size-stroke)/2, cx=size/2, cy=size/2, circ=2*Math.PI*r;
  const s=score==null?0:Math.max(0,Math.min(100,score));
  const cls=band(score);
  const col={good:'var(--good)',ni:'var(--ni)',poor:'var(--poor)',none:'var(--none)'}[cls];
  return (
    <div className="gauge">
      <svg width={size} height={size}>
        <circle cx={cx} cy={cy} r={r} fill="none" stroke={col} opacity="0.16" strokeWidth={stroke}/>
        <circle cx={cx} cy={cy} r={r} fill="none" stroke={col} strokeWidth={stroke}
          strokeDasharray={circ} strokeDashoffset={circ*(1-s/100)} strokeLinecap="round"
          transform={`rotate(-90 ${cx} ${cy})`}/>
        <text x={cx} y={cy} textAnchor="middle" dominantBaseline="central"
          className="num" fontSize={size*0.34} fontWeight="600" fill={col}>{score==null?'—':s}</text>
      </svg>
      <div className="glabel">{label}</div>
    </div>
  );
}
function homepageOf(site){
  const pd=site.pagesData||[];
  return pd.find(p=>{try{return new URL(p.url).pathname==='/';}catch(e){return false;}}) || pd[0] || null;
}
function Card({site,onOpen}){
  const hp=homepageOf(site);
  const m=hp?hp.mobile:{};
  return (
    <div className="card" onClick={()=>onOpen(site)}>
      <div className="chead"><div className="cname">{site.name}</div><div className="chost">{host(site.sample||'')}</div></div>
      <div className="gaugeRow">
        <Gauge score={m.perf} label="Performance"/>
        <Gauge score={m.a11y} label="Accessibility"/>
        <Gauge score={m.bp} label="Best Practices"/>
        <Gauge score={m.seo} label="SEO"/>
      </div>
    </div>
  );
}
function Detail({site,onBack}){
  const [sortKey,setSortKey]=useState('perf');
  const [asc,setAsc]=useState(true);
  const hp=homepageOf(site); const hm=hp?hp.mobile:{};
  const rows=(site.pagesData||[]).map(p=>({url:p.url,...(p.mobile||{})}));
  const sorted=useMemo(()=>{const r=[...rows];r.sort((a,b)=>{const av=a[sortKey],bv=b[sortKey];const an=av==null,bn=bv==null;if(an&&bn)return 0;if(an)return 1;if(bn)return -1;return asc?(av-bv):(bv-av);});return r;},[rows,sortKey,asc]);
  const th=(k,label,left)=>(<th className={left?'l':''} onClick={()=>{setSortKey(k);setAsc(sortKey===k?!asc:true);}}>{label}{sortKey===k?(asc?' ↑':' ↓'):''}</th>);
  return (
    <div>
      <div className="back" onClick={onBack}>← All sites</div>
      <div className="dhead"><h1>{site.name}</h1><span className="host">{host(site.sample||'')}</span></div>
      <p className="h-sub" style={{color:'var(--ink-3)',fontSize:13,margin:'2px 0 0'}}>Homepage · mobile</p>
      <div className="hero">
        <Gauge score={hm.perf} label="Performance" size={110}/>
        <Gauge score={hm.a11y} label="Accessibility" size={110}/>
        <Gauge score={hm.bp} label="Best Practices" size={110}/>
        <Gauge score={hm.seo} label="SEO" size={110}/>
      </div>
      {hm.perfSamples && hm.perfSamples.length>1 &&
        <div style={{textAlign:'center',margin:'-4px 0 0'}}>
          <div style={{fontSize:11,color:'var(--ink-3)',fontWeight:600,textTransform:'uppercase',letterSpacing:'.04em',marginBottom:6}}>
            Homepage Performance · {hm.perfSamples.length} runs (median shown above)</div>
          <div style={{display:'flex',gap:6,justifyContent:'center',flexWrap:'wrap'}}>
            {hm.perfSamples.map((v,i)=>(
              <span key={i} className={"pill "+band(v)} style={{minWidth:34}}>{v}</span>
            ))}
          </div>
        </div>}
      <div className="panel">
        <h2>All pages</h2>
        <p className="h-sub">Mobile Lighthouse scores per page. Click a column to sort.</p>
        <div style={{overflowX:'auto'}}>
        <table>
          <thead><tr>{th('__u','Page',true)}{th('perf','Performance')}{th('a11y','Accessibility')}{th('bp','Best Practices')}{th('seo','SEO')}</tr></thead>
          <tbody>
            {sorted.map((r,i)=>(
              <tr key={i}>
                <td className="l page" title={r.url}>{path(r.url)}</td>
                <td><span className={"pill "+band(r.perf)}>{r.perf==null?'—':r.perf}</span></td>
                <td><span className={"pill "+band(r.a11y)}>{r.a11y==null?'—':r.a11y}</span></td>
                <td><span className={"pill "+band(r.bp)}>{r.bp==null?'—':r.bp}</span></td>
                <td><span className={"pill "+band(r.seo)}>{r.seo==null?'—':r.seo}</span></td>
              </tr>
            ))}
          </tbody>
        </table>
        </div>
      </div>
    </div>
  );
}
function App(){
  const [data,setData]=useState(null);
  const [active,setActive]=useState(null);
  React.useEffect(()=>{fetch('./data.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw 0;return r.json();}).then(setData).catch(()=>setData(SAMPLE_DATA));},[]);
  if(!data) return <div className="empty">Loading…</div>;
  const sites=data.sites||[];
  return (
    <div>
      <header className="top"><div className="wrap">
        <div className="brand"><span className="logoDot"></span>Site Performance</div>
        <div className="sub">{data.demo?'Sample data':'Updated '+(data.generated||'')}</div>
      </div></header>
      <div className="wrap">
        {active ? <Detail site={active} onBack={()=>setActive(null)}/> : <>
          <div className="lead">
            <h1>{sites.length} site{sites.length!==1?'s':''}</h1>
            <p>Google Lighthouse scores (mobile) for Performance, Accessibility, Best Practices, and SEO. Open any site for its full page-by-page report.</p>
          </div>
          {sites.length===0 ? <div className="empty">No sites yet. Add a row to sites.csv and run the monitor.</div>
            : <div className="grid">
                {[...sites].sort((a,b)=>{const ha=homepageOf(a),hb=homepageOf(b);const va=ha&&ha.mobile?ha.mobile.perf:999,vb=hb&&hb.mobile?hb.mobile.perf:999;return (va==null?999:va)-(vb==null?999:vb);}).map((s,i)=><Card key={i} site={s} onOpen={setActive}/>)}
              </div>}
        </>}
      </div>
      <footer><div className="wrap">Google Lighthouse scores via PageSpeed Insights. Green 90–100, orange 50–89, red 0–49. Scores are lab-estimated and vary slightly between runs.</div></footer>
    </div>
  );
}
const SAMPLE_DATA={demo:true,generated:"sample",sites:[
  {name:"Premier LA Perio",sample:"https://laperioimplantcenter.com/",pagesData:[
    {url:"https://laperioimplantcenter.com/",mobile:{perf:85,a11y:100,bp:92,seo:92,perfSamples:[58,72,85,85,91]}},
    {url:"https://laperioimplantcenter.com/dental-implants/",mobile:{perf:77,a11y:96,bp:92,seo:100}},
    {url:"https://laperioimplantcenter.com/local-service-areas/west-la/",mobile:{perf:64,a11y:98,bp:85,seo:92}}
  ]},
  {name:"Jaw Surgery NJ",sample:"https://jawsurgerynj.com/",pagesData:[
    {url:"https://jawsurgerynj.com/",mobile:{perf:41,a11y:92,bp:79,seo:90,perfSamples:[38,41,55,72,90]}},
    {url:"https://jawsurgerynj.com/genioplasty/",mobile:{perf:36,a11y:88,bp:79,seo:92}}
  ]}
]};
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
