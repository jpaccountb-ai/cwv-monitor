<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Site Performance Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
  :root{
    --ink:#111826; --ink-2:#586372; --ink-3:#98a1ad;
    --line:#e9ecf0; --line-2:#f2f4f7; --bg:#ffffff; --panel:#fbfcfd;
    /* PageSpeed Insights palette */
    --good:#0cce6b; --good-bg:#e7faf0;
    --ni:#ffa400;   --ni-bg:#fff4e0;
    --poor:#ff4e42; --poor-bg:#ffece9;
    --none:#c2c8d0; --none-bg:#f3f5f7;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:Inter,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased;}
  .num{font-family:"Space Grotesk",Inter,sans-serif;font-feature-settings:"tnum" 1;}
  .wrap{max-width:1120px;margin:0 auto;padding:0 24px;}

  header.top{border-bottom:1px solid var(--line);padding:20px 0;position:sticky;top:0;
    background:rgba(255,255,255,.9);backdrop-filter:blur(8px);z-index:5;}
  .top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;}
  .brand{font-weight:600;font-size:15.5px;display:flex;align-items:center;gap:10px;letter-spacing:-.01em;}
  .logoDot{width:22px;height:22px;border-radius:6px;background:var(--ink);display:inline-flex;align-items:center;justify-content:center;}
  .logoDot::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--good);}
  .sub{color:var(--ink-3);font-size:12.5px;}

  .lead{padding:40px 0 6px;}
  .lead h1{font-size:25px;font-weight:600;letter-spacing:-.02em;margin:0 0 6px;}
  .lead p{color:var(--ink-2);margin:0;font-size:14.5px;max-width:62ch;}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px;padding:26px 0 64px;}
  .card{border:1px solid var(--line);border-radius:18px;padding:22px 22px 18px;background:var(--bg);
    cursor:pointer;transition:border-color .15s,box-shadow .15s,transform .15s;}
  .card:hover{border-color:#d8dde3;box-shadow:0 8px 30px rgba(17,24,38,.07);transform:translateY(-2px);}
  .chead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;}
  .cname{font-weight:600;font-size:16px;letter-spacing:-.01em;}
  .chost{color:var(--ink-3);font-size:12.5px;}

  .gauges{display:flex;justify-content:center;gap:34px;margin:20px 0 6px;}
  .gauge{display:flex;flex-direction:column;align-items:center;gap:8px;}
  .glabel{font-size:12px;color:var(--ink-2);font-weight:500;letter-spacing:.02em;}

  .cwvblock{margin-top:16px;padding-top:16px;border-top:1px solid var(--line-2);}
  .cwvhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .cwvhead .t{font-size:12px;font-weight:600;color:var(--ink-2);text-transform:uppercase;letter-spacing:.05em;}
  .badge{font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:20px;}
  .badge.good{color:#08894a;background:var(--good-bg);} .badge.poor{color:#cc2c22;background:var(--poor-bg);}
  .badge.none{color:var(--ink-3);background:var(--none-bg);}
  .cwvrow{display:flex;gap:10px;}
  .cwv{flex:1;background:var(--panel);border:1px solid var(--line-2);border-radius:10px;padding:9px 8px;text-align:center;}
  .cwv .m{display:flex;align-items:center;justify-content:center;gap:5px;font-size:11px;color:var(--ink-3);font-weight:600;letter-spacing:.03em;}
  .cwv .v{font-size:15px;font-weight:600;margin-top:3px;}
  .cwv .v.good{color:#08894a;} .cwv .v.ni{color:#b9750a;} .cwv .v.poor{color:#cc2c22;} .cwv .v.none{color:var(--none);}
  .cdot{width:8px;height:8px;border-radius:50%;display:inline-block;}
  .cdot.good{background:var(--good);} .cdot.ni{background:var(--ni);} .cdot.poor{background:var(--poor);} .cdot.none{background:var(--none);}

  /* detail */
  .back{display:inline-flex;align-items:center;gap:7px;color:var(--ink-2);font-size:13.5px;margin:28px 0 0;cursor:pointer;}
  .back:hover{color:var(--ink);}
  .dhead{display:flex;align-items:baseline;gap:14px;margin:14px 0 2px;flex-wrap:wrap;}
  .dhead h1{font-size:24px;font-weight:600;letter-spacing:-.02em;margin:0;}
  .dhead .host{color:var(--ink-3);font-size:14px;}

  .panels{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:22px 0;}
  @media(max-width:720px){ .panels{grid-template-columns:1fr;} }
  .ppanel{border:1px solid var(--line);border-radius:18px;padding:24px;}
  .ppanel .phead{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .ppanel .ptitle{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-2);}
  .ppanel .center{display:flex;align-items:center;gap:22px;}
  .metricList{flex:1;display:flex;flex-direction:column;gap:9px;}
  .mrow{display:flex;align-items:center;gap:10px;font-size:13px;}
  .mrow .ml{color:var(--ink-2);flex:1;}
  .mrow .mv{font-weight:600;}
  .mrow .mv.good{color:#08894a;} .mrow .mv.ni{color:#b9750a;} .mrow .mv.poor{color:#cc2c22;} .mrow .mv.none{color:var(--none);}
  .assessLine{margin-top:16px;padding-top:14px;border-top:1px solid var(--line-2);display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);}

  .panel{border:1px solid var(--line);border-radius:18px;padding:22px;margin:22px 0;}
  .panel h2{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);margin:0;font-weight:600;}
  .panel .h-sub{color:var(--ink-3);font-size:12.5px;margin:2px 0 0;}
  .rowflex{display:flex;align-items:center;gap:12px;}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-left:auto;}
  .seg button{border:0;background:var(--bg);padding:6px 14px;font-size:12.5px;color:var(--ink-2);cursor:pointer;font-family:inherit;}
  .seg button.on{background:var(--ink);color:#fff;}

  table{width:100%;border-collapse:collapse;font-size:13px;margin-top:14px;}
  th,td{padding:10px;text-align:right;border-bottom:1px solid var(--line-2);white-space:nowrap;}
  th{color:var(--ink-3);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.04em;cursor:pointer;user-select:none;}
  th.l,td.l{text-align:left;} td.page{max-width:320px;overflow:hidden;text-overflow:ellipsis;color:var(--ink);}
  .pill{display:inline-block;min-width:40px;padding:3px 9px;border-radius:7px;font-weight:600;}
  .pill.good{color:#08894a;background:var(--good-bg);} .pill.ni{color:#b9750a;background:var(--ni-bg);}
  .pill.poor{color:#cc2c22;background:var(--poor-bg);} .pill.none{color:var(--none);background:var(--none-bg);}
  .muted{color:var(--none);}
  footer{color:var(--ink-3);font-size:12px;padding:28px 0 50px;border-top:1px solid var(--line);}
  .empty{padding:80px 0;text-align:center;color:var(--ink-3);}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useMemo } = React;

const TH = { LCP:[2500,4000], INP:[200,500], CLS:[0.1,0.25], PERF:[90,50] };
function rate(metric,v){
  if(v===null||v===undefined||v==='') return 'none';
  if(metric==='PERF') return v>=90?'good':(v<50?'poor':'ni');
  const [g,p]=TH[metric]; return v<=g?'good':(v>p?'poor':'ni');
}
const host = u=>{try{return new URL(u).host;}catch(e){return u;}};
const path = u=>{try{const p=new URL(u).pathname;return p==='/'?'Homepage':p;}catch(e){return u;}};
const fmtLCP=v=>v==null?'—':(v/1000).toFixed(1)+'\u2009s';
const fmtINP=v=>v==null?'—':Math.round(v)+'\u2009ms';
const fmtCLS=v=>v==null?'—':(+v).toFixed(2);

/* PSI-style gauge ring */
function Gauge({score,label,size=82}){
  const stroke=9, r=(size-stroke)/2, cx=size/2, cy=size/2, circ=2*Math.PI*r;
  const s=score==null?0:Math.max(0,Math.min(100,score));
  const cls=score==null?'none':rate('PERF',score);
  const col={good:'var(--good)',ni:'var(--ni)',poor:'var(--poor)',none:'var(--none)'}[cls];
  return (
    <div className="gauge">
      <svg width={size} height={size}>
        <circle cx={cx} cy={cy} r={r} fill="none" stroke={col} opacity="0.16" strokeWidth={stroke}/>
        <circle cx={cx} cy={cy} r={r} fill="none" stroke={col} strokeWidth={stroke}
          strokeDasharray={circ} strokeDashoffset={circ*(1-s/100)} strokeLinecap="round"
          transform={`rotate(-90 ${cx} ${cy})`}/>
        <text x={cx} y={cy} textAnchor="middle" dominantBaseline="central"
          className="num" fontSize={size*0.34} fontWeight="600" fill={col}>{score==null?'—':s}</text>
      </svg>
      <div className="glabel">{label}</div>
    </div>
  );
}
function assess(m){
  if(!m || (m.fLCP==null&&m.fINP==null&&m.fCLS==null)) return {t:'Not enough data',c:'none'};
  const ok = m.fLCP!=null&&rate('LCP',m.fLCP)==='good'
          && m.fINP!=null&&rate('INP',m.fINP)==='good'
          && m.fCLS!=null&&rate('CLS',m.fCLS)==='good';
  return ok?{t:'Passed',c:'good'}:{t:'Failed',c:'poor'};
}
function homepageOf(site){
  const pd=site.pagesData||[];
  return pd.find(p=>{try{return new URL(p.url).pathname==='/';}catch(e){return false;}}) || pd[0] || null;
}

function Cwv({label,value,metric,fmt}){
  const r=value==null?'none':rate(metric,value);
  return (
    <div className="cwv">
      <div className="m"><span className={"cdot "+r}></span>{label}</div>
      <div className={"v num "+r}>{fmt(value)}</div>
    </div>
  );
}

function Card({site,onOpen}){
  const hp=homepageOf(site);
  const m=hp?hp.mobile:null, d=hp?hp.desktop:null;
  const a=assess(m);
  return (
    <div className="card" onClick={()=>onOpen(site)}>
      <div className="chead">
        <div className="cname">{site.name}</div>
        <div className="chost">{host(site.sample||'')}</div>
      </div>
      <div className="gauges">
        <Gauge score={m?m.perf:null} label="Mobile"/>
        <Gauge score={d?d.perf:null} label="Desktop"/>
      </div>
      <div className="cwvblock">
        <div className="cwvhead">
          <span className="t">Core Web Vitals</span>
          <span className={"badge "+a.c}>{a.t}</span>
        </div>
        <div className="cwvrow">
          <Cwv label="LCP" value={m?m.fLCP:null} metric="LCP" fmt={fmtLCP}/>
          <Cwv label="INP" value={m?m.fINP:null} metric="INP" fmt={fmtINP}/>
          <Cwv label="CLS" value={m?m.fCLS:null} metric="CLS" fmt={fmtCLS}/>
        </div>
      </div>
    </div>
  );
}

function ScorePanel({title, data}){
  const a=assess(data);
  const mrow=(label,val,metric,fmt)=>{
    const r=val==null?'none':rate(metric,val);
    return <div className="mrow"><span className={"cdot "+r}></span><span className="ml">{label}</span><span className={"mv "+r}>{fmt(val)}</span></div>;
  };
  return (
    <div className="ppanel">
      <div className="phead"><span className="ptitle">{title}</span></div>
      <div className="center">
        <Gauge score={data?data.perf:null} label="Performance" size={94}/>
        <div className="metricList">
          {mrow('Largest Contentful Paint', data?data.fLCP:null,'LCP',fmtLCP)}
          {mrow('Interaction to Next Paint', data?data.fINP:null,'INP',fmtINP)}
          {mrow('Cumulative Layout Shift', data?data.fCLS:null,'CLS',fmtCLS)}
        </div>
      </div>
      <div className="assessLine"><span className={"badge "+a.c}>{a.t}</span> Core Web Vitals assessment (real-user data)</div>
    </div>
  );
}

function Detail({site,onBack}){
  const [strat,setStrat]=useState('mobile');
  const [sortKey,setSortKey]=useState('perf');
  const [asc,setAsc]=useState(true);
  const hp=homepageOf(site);
  const rows=(site.pagesData||[]).map(p=>({url:p.url,...p[strat]}));
  const sorted=useMemo(()=>{
    const r=[...rows];
    r.sort((a,b)=>{const av=a[sortKey],bv=b[sortKey];
      const an=av==null,bn=bv==null; if(an&&bn)return 0; if(an)return 1; if(bn)return -1;
      return asc?(av-bv):(bv-av);});
    return r;
  },[rows,sortKey,asc]);
  const th=(k,label,left)=>(
    <th className={left?'l':''} onClick={()=>{setSortKey(k);setAsc(sortKey===k?!asc:true);}}>
      {label}{sortKey===k?(asc?' ↑':' ↓'):''}</th>);
  return (
    <div>
      <div className="back" onClick={onBack}>← All sites</div>
      <div className="dhead"><h1>{site.name}</h1><span className="host">{host(site.sample||'')}</span></div>
      <p className="h-sub" style={{color:'var(--ink-3)',fontSize:13,margin:'2px 0 0'}}>Homepage performance</p>

      <div className="panels">
        <ScorePanel title="Mobile" data={hp?hp.mobile:null}/>
        <ScorePanel title="Desktop" data={hp?hp.desktop:null}/>
      </div>

      <div className="panel">
        <div className="rowflex">
          <div>
            <h2>All pages</h2>
            <p className="h-sub">Performance score and Core Web Vitals per page. Click a column to sort.</p>
          </div>
          <div className="seg">
            <button className={strat==='mobile'?'on':''} onClick={()=>setStrat('mobile')}>Mobile</button>
            <button className={strat==='desktop'?'on':''} onClick={()=>setStrat('desktop')}>Desktop</button>
          </div>
        </div>
        <div style={{overflowX:'auto'}}>
        <table>
          <thead><tr>
            {th('__u','Page',true)}{th('perf','Perf')}
            {th('fLCP','LCP')}{th('fINP','INP')}{th('fCLS','CLS')}
          </tr></thead>
          <tbody>
            {sorted.map((r,i)=>(
              <tr key={i}>
                <td className="l page" title={r.url}>{path(r.url)}</td>
                <td><span className={"pill "+rate('PERF',r.perf)}>{r.perf==null?'—':r.perf}</span></td>
                <td><span className={"pill "+(r.fLCP==null?'none':rate('LCP',r.fLCP))}>{fmtLCP(r.fLCP)}</span></td>
                <td><span className={"pill "+(r.fINP==null?'none':rate('INP',r.fINP))}>{fmtINP(r.fINP)}</span></td>
                <td><span className={"pill "+(r.fCLS==null?'none':rate('CLS',r.fCLS))}>{fmtCLS(r.fCLS)}</span></td>
              </tr>
            ))}
          </tbody>
        </table>
        </div>
      </div>
    </div>
  );
}

function App(){
  const [data,setData]=useState(null);
  const [active,setActive]=useState(null);
  React.useEffect(()=>{
    fetch('./data.json',{cache:'no-store'})
      .then(r=>{if(!r.ok)throw 0;return r.json();})
      .then(setData).catch(()=>setData(SAMPLE_DATA));
  },[]);
  if(!data) return <div className="empty">Loading…</div>;
  const sites=data.sites||[];
  return (
    <div>
      <header className="top"><div className="wrap">
        <div className="brand"><span className="logoDot"></span>Site Performance</div>
        <div className="sub">{data.demo?'Sample data':'Updated '+(data.generated||'')}</div>
      </div></header>
      <div className="wrap">
        {active
          ? <Detail site={active} onBack={()=>setActive(null)}/>
          : <>
            <div className="lead">
              <h1>{sites.length} site{sites.length!==1?'s':''}</h1>
              <p>Google PageSpeed scores for mobile and desktop, with the three Core Web Vitals from real-user data. Open any site for its full page-by-page report.</p>
            </div>
            {sites.length===0
              ? <div className="empty">No sites yet. Add a row to sites.csv and run the monitor.</div>
              : <div className="grid">
                  {[...sites].sort((a,b)=>{
                    const ha=homepageOf(a), hb=homepageOf(b);
                    const va=ha&&ha.mobile?ha.mobile.perf:999, vb=hb&&hb.mobile?hb.mobile.perf:999;
                    return (va??999)-(vb??999);
                  }).map((s,i)=><Card key={i} site={s} onOpen={setActive}/>)}
                </div>}
          </>}
      </div>
      <footer><div className="wrap">
        Performance scores and Core Web Vitals from Google PageSpeed Insights. Green 90–100, orange 50–89, red 0–49.
        “Not enough data” means a page has too little real-user Chrome traffic to report field metrics yet.
      </div></footer>
    </div>
  );
}

const SAMPLE_DATA={demo:true,generated:"sample",sites:[
  {name:"Jaw Surgery NJ",sample:"https://jawsurgerynj.com/",pages:81,pagesData:[
    {url:"https://jawsurgerynj.com/",mobile:{perf:41,fLCP:3600,fINP:210,fCLS:0.06},desktop:{perf:78,fLCP:1900,fINP:120,fCLS:0.04}},
    {url:"https://jawsurgerynj.com/genioplasty/",mobile:{perf:36,fLCP:4200,fINP:260,fCLS:0.11},desktop:{perf:72,fLCP:2100,fINP:140,fCLS:0.05}},
    {url:"https://jawsurgerynj.com/bsso/",mobile:{perf:33,fLCP:null,fINP:null,fCLS:null},desktop:{perf:69,fLCP:null,fINP:null,fCLS:null}},
    {url:"https://jawsurgerynj.com/sleep-apnea/",mobile:{perf:44,fLCP:3100,fINP:180,fCLS:0.05},desktop:{perf:82,fLCP:1700,fINP:90,fCLS:0.03}}
  ]},
  {name:"Premier LA Perio",sample:"https://premierlaperio.com/",pages:22,pagesData:[
    {url:"https://premierlaperio.com/",mobile:{perf:88,fLCP:2100,fINP:150,fCLS:0.04},desktop:{perf:96,fLCP:1200,fINP:80,fCLS:0.02}},
    {url:"https://premierlaperio.com/dental-implants/",mobile:{perf:79,fLCP:2600,fINP:190,fCLS:0.08},desktop:{perf:92,fLCP:1400,fINP:110,fCLS:0.03}}
  ]},
  {name:"New Client Co",sample:"https://example.com/",pages:14,pagesData:[
    {url:"https://example.com/",mobile:{perf:null,fLCP:null,fINP:null,fCLS:null},desktop:{perf:null,fLCP:null,fINP:null,fCLS:null}}
  ]}
]};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
